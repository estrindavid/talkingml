project:
  type: website
  output-dir: _site
  render:
    - /index.qmd
    - /about.qmd
    - /interviews.qmd
    - /404.qmd
    - /posts/**/*.qmd
  post-render:
    - node scripts/normalize-output.mjs
  resources:
    - /assets/**
    - /scripts/carousel.js
    - /scripts/reading-progress.js
    - /scripts/views.js
    - /robots.txt

author: David Estrine

website:
  title: TalkingML
  site-url: https://talkingml.com
  description: "David's public notebook for explanations and experiments while learning how modern AI systems work."
  favicon: /assets/david-avatar.png
  image: /assets/david-avatar.png
  search: false
  open-graph:
    locale: en_US
  twitter-card:
    card-style: summary
  navbar:
    title: TalkingML
    collapse: true
    right:
      - href: /#progress
        text: Progress
      - href: interviews.qmd
        text: Interviews
      - href: /#notes
        text: Notes
      - href: about.qmd
        text: About
  page-footer:
    border: true
    left: '<span class="footer-wordmark">TalkingML<span aria-hidden="true">.</span></span>'
    center: "© 2026 David Estrine. All rights reserved."
    right:
      - text: RSS
        href: /index.xml

format:
  html:
    theme:
      - default
      - styles.scss
    canonical-url: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    smooth-scroll: true
    toc: true
    toc-location: right
    include-in-header: includes/head.html
    grid:
      sidebar-width: 240px
      body-width: 720px
      margin-width: 240px
      gutter-width: 2rem

lang: en
