name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Worker binding types
        run: npm run types

      - name: Check generated Worker binding types
        run: git diff --exit-code -- worker-configuration.d.ts

      - name: Type-check Worker and tests
        run: npm run typecheck

      - name: Render Quarto website
        run: npm run build

      - name: Validate generated website
        run: npm run validate:site

      - name: Test Worker API and assets with local D1
        run: npm test

      - name: Compile Worker deployment without deploying
        run: npm run deploy:dry-run
